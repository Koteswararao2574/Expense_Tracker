spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate # Never auto-alter schema in production
    show-sql: false

logging:
  level:
    com.expensetracker: INFO
    org.springframework.security: WARN

server:
  port: ${PORT:8080}
